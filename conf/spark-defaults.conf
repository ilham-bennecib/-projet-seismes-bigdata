# Configuration commune a tous les jobs Spark du projet

# cluster
spark.master                      spark://spark-master:7077

# stockage par defaut : HDFS  ("/lakehouse/..." = "hdfs://namenode:9000/lakehouse/...")
spark.hadoop.fs.defaultFS         hdfs://namenode:9000
# 2 copies de chaque bloc (= nombre de DataNodes ; sinon le client HDFS de Spark en demande 3)
spark.hadoop.dfs.replication      2

# Delta Lake
spark.sql.extensions              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog   org.apache.spark.sql.delta.catalog.DeltaCatalog

# dates en UTC (comme les donnees USGS)
spark.sql.session.timeZone        UTC

# journaux des applications, relus par le History Server
spark.eventLog.enabled            true
spark.eventLog.dir                file:/work/data/spark-events
spark.history.fs.logDirectory     file:/work/data/spark-events
